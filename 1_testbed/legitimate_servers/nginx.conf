# Legitimate-traffic front end.
#
# FIX B-4: the same nginx build and the same TLS parameters that front the WebTunnel bridge now
# also terminate TLS for every negative class.  The application (FastAPI/hypercorn) sits behind
# it on plain HTTP and no longer speaks TLS at all.
#
# Two TLS listeners, deliberately:
#   8443  ALPN advertises h2 and http/1.1  -> the HTTP/2 classes
#   8444  ALPN advertises http/1.1 only    -> the WebSocket classes (nginx has no RFC 8441
#                                             Extended CONNECT, so WSS needs http/1.1)
#   8080  plain HTTP, reachable only inside the Docker network and through the onion service
#
# The CLIENT offers the identical ALPN list {h2, http/1.1} to all of them and uses the identical
# SNI, so the ClientHello stays byte-identical across classes and gate G1 is satisfiable.  Only
# the destination port differs, which is not part of the ClientHello and is exactly how real
# deployments separate a WSS endpoint from an HTTP/2 origin.

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream legit_app { server legitimate-app:8000; keepalive 32; }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # ---- HTTP/2 origin -----------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name legitimate-servers legitimate.local localhost 172.20.0.20;
        include /etc/nginx/conf.d/tls_common.conf;

        location / {
            proxy_pass http://legit_app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
        }
    }

    # ---- WebSocket origin (http/1.1 only) ----------------------------------
    server {
        listen 8444 ssl;
        # http2 intentionally OFF: nginx cannot carry WebSockets over HTTP/2.
        server_name legitimate-servers legitimate.local localhost 172.20.0.20;
        include /etc/nginx/conf.d/tls_common.conf;

        location / {
            proxy_pass http://legit_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }
    }

    # ---- plain HTTP, for the onion service (FIX B-3) -----------------------
    # The WebTunnel class fetches THESE endpoints through the tunnel, so the positive and the
    # negative classes exercise the same server, the same handlers and the same byte budgets.
    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://legit_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }
    }
}
