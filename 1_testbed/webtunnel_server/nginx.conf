events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name webtunnel.local localhost 172.20.0.10;
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name webtunnel.local localhost 172.20.0.10;

        # FIX B-4: identical TLS parameters to the legitimate-servers front end.
        include /etc/nginx/conf.d/tls_common.conf;

        # WebTunnel Secret Path - Reverse proxy to Tor Bridge backend
        location /secret-path-wt-research-2026 {
            proxy_pass http://tor-bridge:15000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;

            # Extended timeouts for persistent tunnel streams
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        # Legitimate Decoy Website (Fallback for all non-secret paths & active probing)
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
