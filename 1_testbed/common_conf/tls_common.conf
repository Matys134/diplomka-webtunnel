# Shared TLS termination parameters.
#
# FIX B-4 (docs/05-final-review.md).  The bridge front-end ran nginx while the legitimate
# servers terminated TLS with Python/hypercorn.  The two stacks differ in whether they emit the
# TLS 1.3 middlebox-compatibility ChangeCipherSpec, so `down_len_min` was 6 B for every WebTunnel
# flow and 24-58 B for every negative -- a single-feature stump at AUC 1.0000 that had nothing to
# do with Tor.  Both front-ends now include THIS file, so the server side cannot drift again.
#
# Any change here applies to the bridge and to the legitimate servers simultaneously. That is
# the point: one source of truth for the server-side TLS parameters.

ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       10m;
